<title>Unit 4–6 水果忍者・繽紛音效整合版</title>
<style>
:root{--bg:#0b1b3a;--panel:#14284f;--panel2:#1c356b;--text:#fff;--mut:#a9bbe0;--blue:#1e88e5;--org:#f28c28;--pur:#9b7bff;--red:#ff5a5a;--grn:#3ddc84;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;display:none;grid-template-columns:1fr minmax(0,2.4fr) 1fr;gap:8px;padding:8px 12px;pointer-events:none;align-items:start}
#hud .l{font-size:clamp(20px,3vw,34px);font-weight:800}
#hud .r{text-align:right;font-size:clamp(22px,3vw,34px)}
#combo{color:var(--org);font-size:clamp(16px,2.2vw,26px);font-weight:800;min-height:1.3em}
#pr{background:rgba(20,40,79,.86);border:2px solid #3b5ea8;border-radius:18px;padding:8px 14px;text-align:center;pointer-events:auto}
#pr .t{font-size:clamp(30px,5.4vw,66px);font-weight:800;line-height:1.15}
#pr .g{font-size:clamp(15px,2vw,22px);color:var(--mut)}
#bar{height:12px;border-radius:8px;background:#0b1b3a;margin-top:6px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:var(--grn);transition:background .3s}
#pr button{font-size:20px;background:none;border:0;color:#fff;cursor:pointer}
#scr{position:absolute;inset:0;overflow:auto;padding:16px;display:none;background:rgba(7,16,38,.94)}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:clamp(28px,5vw,52px);margin:6px 0}
h2{font-size:clamp(20px,3vw,30px);margin:14px 0 8px}
.sub{color:var(--mut);font-size:clamp(15px,2vw,20px)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip,.btn{font:inherit;font-size:clamp(16px,2.2vw,22px);padding:10px 16px;border-radius:14px;border:2px solid #3b5ea8;background:var(--panel);color:#fff;cursor:pointer}
.chip.on{background:var(--blue);border-color:#8cc4ff}
.btn.go{background:var(--org);border-color:#ffc27a;color:#1a1200;font-weight:800;font-size:clamp(20px,3vw,30px);padding:14px 26px}
.btn.alt{background:var(--pur);border-color:#c5b4ff}
.btn.sm{font-size:16px;padding:6px 12px}
input.nm{font:inherit;font-size:clamp(20px,3vw,28px);padding:10px 14px;border-radius:12px;border:2px solid #3b5ea8;background:#0b1b3a;color:#fff;width:min(100%,360px);-webkit-user-select:text;user-select:text}
.card{background:var(--panel);border:2px solid #3b5ea8;border-radius:22px;padding:20px;min-height:300px;cursor:pointer}
.card .w{font-size:clamp(44px,9vw,96px);font-weight:800;line-height:1.1}
.card .z{font-size:clamp(30px,5vw,54px);font-weight:800;color:#ffd08a}
.card p{font-size:clamp(17px,2.3vw,24px);margin:8px 0;line-height:1.5}
.k{color:var(--mut);font-size:.8em}
.mem{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.mem div{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:clamp(16px,2vw,21px);line-height:1.5;white-space:pre-line}
.mem b{display:block;color:#8cc4ff}
.tab{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.list .it{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-bottom:1px solid #2a4380;cursor:pointer;font-size:clamp(18px,2.4vw,26px)}
.list .it b{min-width:9em}
table{width:100%;border-collapse:collapse;font-size:clamp(18px,2.4vw,26px)}
td,th{padding:8px 10px;border-bottom:1px solid #2a4380;text-align:left}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-size:clamp(20px,3vw,32px)}
.opt.ok{background:#1b7a46;border-color:#3ddc84}.opt.no{background:#8a2b2b;border-color:#ff7a7a}
.me{color:var(--org);font-weight:800}
.note{color:var(--mut);font-size:15px;margin-top:6px}

/* Tropical arcade visual refresh */
:root{--bg:#10204c;--panel:#253c80;--panel2:#324d94;--mut:#d6e8ff;--blue:#00bce8;--org:#ffb62b;--pur:#b56aff;--red:#ff557e;--grn:#64ef8e}
body{background:radial-gradient(ellipse at 18% 10%,#334caa 0%,transparent 42%),radial-gradient(ellipse at 85% 80%,#5c246f 0%,transparent 45%),#10204c}
#scr{background:radial-gradient(circle at 10% 5%,rgba(255,202,55,.18),transparent 30%),radial-gradient(circle at 95% 20%,rgba(255,73,156,.2),transparent 35%),linear-gradient(145deg,rgba(18,35,92,.97),rgba(55,25,91,.97))}
.wrap{position:relative}h1{color:#fff4a3;text-shadow:0 3px 0 #d75a46,0 6px 0 #742e75,0 9px 22px #070d37;font-weight:1000;letter-spacing:.02em}
h2{color:#ffdc79;text-shadow:0 2px 8px #4b225c}
.sub,.note{color:#d9e9ff}.chip,.btn{border:2px solid #90dfff;background:linear-gradient(155deg,#4666b9,#283d83);box-shadow:0 5px 0 #162653,0 7px 14px #090e3566;font-weight:750;transition:transform .12s,filter .12s}
.chip:hover,.btn:hover{filter:brightness(1.17);transform:translateY(-2px)}.chip:active,.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #162653}
.chip.on{background:linear-gradient(140deg,#04cde0,#2976e8);border-color:#b1fbff}.btn.go{background:linear-gradient(135deg,#ffe75d,#ff9d2e 65%,#ff5e56);border-color:#fff6ae;color:#532b14;box-shadow:0 6px 0 #a74524,0 10px 20px #170d3d88}
.btn.alt{background:linear-gradient(135deg,#e76af0,#865aff);border-color:#f6c1ff;box-shadow:0 5px 0 #5934a1}
.card{background:linear-gradient(145deg,#365ab1,#252b78);border:3px solid #ffcb6b;box-shadow:0 10px 0 #17265b,0 18px 30px #080d2f77,inset 0 1px 20px #ffffff19}
.card .w{color:#fff;text-shadow:0 4px 0 #182e75}.card .z{color:#ffdc6e}.mem div{background:linear-gradient(135deg,#3c63aa,#3b357e);border:1px solid #93b4ff66}.mem b{color:#aaf7ff}
.list .it{border-bottom:1px solid #7fa8ff55}.list .it:nth-child(odd){background:#ffffff0a}.list .it:hover{background:#ffd46624}
input.nm{background:#1a2e6b;border:2px solid #ffda79;box-shadow:inset 0 2px 8px #070d3a}
#pr{background:linear-gradient(145deg,#374caaed,#592f88ed);border:3px solid #ffdc77;box-shadow:0 5px 0 #20265b,0 8px 24px #0008}
#pr .t{color:#fff7a5;text-shadow:0 3px 0 #ac4b6c}#bar{background:#1a245e;border:1px solid #9fbdff}#bar i{background:linear-gradient(90deg,#5ff49a,#fff275,#ffae3b)}
#combo{color:#ffe05d;text-shadow:0 3px 8px #ff5a52}.me{color:#ffe46d}.opt.ok{background:#168d6a}.opt.no{background:#b42f66}
@media(max-width:600px){.card{padding:15px;min-height:240px}.chip,.btn{padding:10px 12px}#hud{padding:7px}}
</style>

let fxLastSwipe=0;
function fx(kind){
 if(!S.sound)return;
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume().catch(()=>{});
  const now=AC.currentTime;
  function tone(f,end,d=.16,type='sine',vol=.12,delay=0){
   const o=AC.createOscillator(),g=AC.createGain(),t=now+delay;
   o.type=type;o.frequency.setValueAtTime(Math.max(30,f),t);
   o.frequency.exponentialRampToValueAtTime(Math.max(30,end),t+d);
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);
   g.gain.exponentialRampToValueAtTime(.0001,t+d);
   o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.015);
  }
  function noise(d=.13,vol=.13,filter=1100){
   const n=Math.max(1,Math.ceil(AC.sampleRate*d)),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
   for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
   const src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();src.buffer=b;fl.type='bandpass';fl.frequency.value=filter;fl.Q.value=.7;g.gain.value=vol;
   src.connect(fl);fl.connect(g);g.connect(AC.destination);src.start(now);src.stop(now+d);
  }
  switch(kind){
   case 'swipe':noise(.09,.055,2600);tone(950,420,.10,'triangle',.035);break;
   case 'slice':noise(.18,.19,1500);tone(560,180,.16,'triangle',.15);break;
   case 'correct':tone(530,850,.12,'sine',.13);tone(800,1200,.17,'triangle',.11,.09);break;
   case 'wrong':tone(330,115,.36,'sawtooth',.12);noise(.22,.07,320);break;
   case 'bomb':tone(140,38,.55,'sawtooth',.21);noise(.48,.25,250);break;
   case 'combo':tone(620,930,.15,'triangle',.13);tone(930,1450,.23,'sine',.14,.13);break;
   case 'bonus':tone(420,690,.17,'sine',.13);tone(690,1040,.22,'triangle',.13,.14);tone(1040,1550,.28,'sine',.12,.28);break;
   case 'start':tone(390,620,.15,'triangle',.12);tone(580,940,.22,'triangle',.13,.15);break;
   case 'finish':tone(650,430,.20,'triangle',.12);tone(430,260,.33,'sine',.11,.20);break;
   case 'tap':tone(520,690,.065,'sine',.055);break;
  }
 }catch(e){}

function endGame(){
  G.over=true;fx('finish');cancelAnimationFrame(raf);
  const rec={name:S.name||'同學',score:G.score,mode:S.mode,diff:S.diff,unit:S.unit,ts:Date.now()};
  if(G.score>LS.get('u456best',0))LS.set('u456best',G.score);
  saveScore(rec).then(()=>{if(view==='over'){const m=$('#sv');if(m)m.textContent=LB.msg}});
  const ms=[...G.miss.values()];
  show(`<h1>遊戲結束</h1><div class="sub"><span id="sv">${esc(LB.msg||'儲存中…')}</span></div>
  <h2>${esc(rec.name)}　得分 <span class="me">${G.score}</span></h2>
  <p class="sub">答對 ${G.right} / ${G.total}　·　最高連擊 ${G.maxCombo}　·　${esc(MODE[S.mode])}　·　${esc(DIFF[S.diff][0])}</p>
  ${ms.length?`<h2>這局答錯的單字</h2><table>${ms.map(x=>`<tr><td><b>${esc(x.word)}</b></td><td>${esc(x.tag)} ${esc(x.zh)}</td></tr>`).join('')}</table>`:'<p class="sub">全部答對，太強了！</p>'}
  <div class="row" style="margin-top:14px"><button class="btn go" data-a="start">再玩一次</button><button class="btn alt" data-a="learn">📖 學習區複習</button><button class="btn" data-a="board">🏆 排行榜</button><button class="btn" data-a="home">首頁</button></div>`,'over');
}
/* ---------- input ---------- */
let down=false,lp=null;
cv.addEventListener('pointerdown',e=>{if(!G||G.over)return;down=true;lp=pt(e);G.swipe={n:0,sp:0,b:0};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!down||!G||G.over)return;const p=pt(e);G.trail.push({x:p.x,y:p.y,t:G.t});if(lp&&Math.hypot(p.x-lp.x,p.y-lp.y)>3){if(performance.now()-fxLastSwipe>105){fx('swipe');fxLastSwipe=performance.now()}const ang=Math.atan2(p.y-lp.y,p.x-lp.x);for(const f of G.fruits){if(f.cut||!f.act)continue;if(segDist(lp,p,f)<R*.95){sliceF(f,ang)}}}lp=p});
const up=()=>{down=false;lp=null};addEventListener('pointerup',up);addEventListener('pointercancel',up);
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function segDist(a,b,c){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((c.x-a.x)*dx+(c.y-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(a.x+t*dx-c.x,a.y+t*dy-c.y)}
$('#sd').addEventListener('click',()=>{S.sound=!S.sound;LS.set('u456snd',S.sound);hud()});
$('#pr').addEventListener('click',()=>{if(G&&!G.over&&G.q&&G.q.dir==='e2c')say(G.q.it,'w')});
/* ---------- clicks ---------- */
scr.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;if(a!=='start'&&a!=='snd')fx('tap');
  const nm=$('#nm');if(nm)S.name=nm.value.trim().slice(0,12);
  if(a==='set'){S[b.dataset.g]=v;home()}
  else if(a==='start'){if(!S.name){S.name='同學'}startGame()}
  else if(a==='home')home();
  else if(a==='snd'){S.sound=!S.sound;LS.set('u456snd',S.sound);home()}
  else if(a==='learn'){learn()}
  else if(a==='board')board();
  else if(a==='tab'){L.tab=v;L.q=null;L.flip=false;learn()}
  else if(a==='lsec'){L.sec=v;L.i=0;L.flip=false;learn()}
  else if(a==='lunit'){L.unit=v;L.i=0;L.flip=false;learn()}
  else if(a==='flip'){L.flip=!L.flip;learn();const it=Lr()[L.i];if(L.flip&&it)say(it,'w')}
  else if(a==='say'){const it=Lr()[L.i];if(it)say(it,b.dataset.k)}
  else if(a==='prev'||a==='next'){const n=Lr().length;L.i=(L.i+(a==='next'?1:n-1))%n;L.flip=false;learn()}
  else if(a==='known'){const it=Lr()[L.i];S.known.add(it.id);S.miss.delete(it.id);LS.set('u456known',[...S.known]);LS.set('u456miss',[...S.miss]);L.i=(L.i+1)%Lr().length;L.flip=false;learn()}
  else if(a==='review'){const it=Lr()[L.i];S.miss.add(it.id);S.known.delete(it.id);LS.set('u456miss',[...S.miss]);LS.set('u456known',[...S.known]);L.i=(L.i+1)%Lr().length;L.flip=false;learn()}
  else if(a==='open'){L.tab='card';L.i=+b.dataset.i;L.flip=true;learn()}
  else if(a==='missgame'){S.pool='miss';startGame()}
  else if(a==='clearmiss'){S.miss.clear();LS.set('u456miss',[]);learn()}
  else if(a==='qstart'){qNew();learn()}
  else if(a==='qpick'){const q=L.q;if(q.done)return;q.done=true;q.pick=+b.dataset.j;const it=q.n[q.i];if(q.opts[q.pick]===it)q.ok++;else{S.miss.add(it.id);LS.set('u456miss',[...S.miss])}say(it,'w');learn()}
  else if(a==='qnext'){L.q.i++;qSet();learn()}
  else if(a==='clearlb'){if(LB.db&&confirm('確定清除全班排行榜？')){LB.ids.forEach(id=>LB.db.collection('scores').doc(id).delete().catch(()=>{}))}}
});
home();addEventListener('load',initCaps);
</script>
</body>
</html>
